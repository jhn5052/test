<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#172923" />
    <meta name="description" content="공인중개사 기출문제를 풀고, 과목별 성적·오답·필수 암기 듣기로 복습하는 학습 도구" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="공인중개사 기출연습" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>공인중개사 기출연습</title>
    <link rel="stylesheet" href="./styles.css?v=52" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="공인중개사 기출연습 홈">
          <span class="brand-mark">기</span>
          <span><strong>기출연습</strong><small>공인중개사 학습실</small></span>
        </a>
        <div class="sidebar-label">STUDY DESK</div>
        <nav class="primary-nav" aria-label="주 메뉴">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span> 대시보드</button>
          <button class="nav-item" data-view="exam"><span class="nav-icon">▤</span> 시험 응시</button>
          <button class="nav-item" data-view="mistakes"><span class="nav-icon">↺</span> 오답노트 <span id="mistake-count" class="nav-count">0</span></button>
          <button class="nav-item" data-view="study-types"><span class="nav-icon">✳</span> 암기카드 <span id="flashcard-count" class="nav-count">0</span></button>
          <button class="nav-item" data-view="summary"><span class="nav-icon">✎</span> 필수 암기</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="streak-card"><span class="streak-spark">✳</span><div><b id="streak-days">오늘도 한 걸음</b><small>꾸준한 풀이가 합격을 만듭니다</small></div></div>
          <div class="sidebar-foot">기출 2020 — 2025 · 예상 2026<br><span>모든 기록은 이 기기에 저장됩니다</span></div>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="breadcrumb"><span>학습실</span><i>/</i><strong id="page-name">대시보드</strong></div>
          <div class="topbar-right"><span class="local-badge"><i></i> 내 기기에 저장 중</span><button class="header-reset" data-action="reset" aria-label="기록 전체 초기화">초기화</button><span class="avatar">수</span></div>
        </header>
        <main id="app-main" tabindex="-1"></main>
      </div>
    </div>
    <dialog id="reset-dialog" class="confirm-dialog">
      <form method="dialog"><button class="dialog-x" aria-label="닫기">×</button></form>
      <div class="dialog-icon">!</div>
      <p class="eyebrow">RESET STUDY DATA</p>
      <h2>모든 기록을 지울까요?</h2>
      <p class="dialog-copy">시험 이력과 오답, 암기카드, 문항 확인 요청이 모두 삭제됩니다.<br>삭제한 기록은 되돌릴 수 없습니다.</p>
      <div class="dialog-actions"><button class="button button-quiet" id="reset-cancel">계속 공부하기</button><button class="button button-danger" id="reset-confirm">전체 삭제</button></div>
    </dialog>
    <dialog id="question-issue-dialog" class="confirm-dialog issue-dialog">
      <form id="question-issue-form">
        <button type="button" class="dialog-x" id="issue-cancel" aria-label="닫기">×</button>
        <div class="dialog-icon issue-dialog-icon">!</div>
        <p class="eyebrow">QUESTION REVIEW</p>
        <h2>문항 확인 요청</h2>
        <p class="dialog-copy" id="issue-question-label"></p>
        <label class="issue-field-label" for="issue-category">확인할 항목</label>
        <select id="issue-category" class="filter-select">
          <option>문제 본문·OCR</option><option>보기·정답</option><option>해설</option><option>개념 연결</option><option>기타</option>
        </select>
        <label class="issue-field-label" for="issue-description">어떤 점을 확인하면 될까요? <span>선택</span></label>
        <textarea id="issue-description" maxlength="500" rows="4" placeholder="예: 보기 ③의 문장이 잘려 보여요."></textarea>
        <div class="dialog-actions"><button type="button" class="button button-quiet" id="issue-cancel-secondary">취소</button><button type="submit" class="button button-primary">GitHub 신고 작성</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./learning-engine.js?v=52" defer></script>
    <script src="./cloze-practice.js?v=52" defer></script>
    <script src="./quick-memory.js?v=52" defer></script>
    <script src="./app.js?v=52" defer></script>
  </body>
</html>
